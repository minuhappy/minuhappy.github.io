<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>minuhappy — 앱 모음</title>
  <meta name="description" content="minuhappy가 만든 앱을 소개합니다. 앱 소개 페이지, 스토어 링크, 개인정보처리방침을 한곳에서 확인하세요." />
  <meta name="theme-color" content="#6366F1" />
  <link rel="icon" type="image/png" href="gugudan/assets/favicon.png" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="minuhappy — 앱 모음" />
  <meta property="og:description" content="minuhappy가 만든 앱을 소개합니다." />
  <meta property="og:url" content="https://minuhappy.github.io/" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #6366F1;
      --primary-soft: #EEF0FF;
      --ink: #1C2033;
      --sub: #5B6275;
      --bg: #F6F7FB;
      --card: #FFFFFF;
      --line: #E6E8F0;
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.6;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }
    img { max-width: 100%; height: auto; display: block; }
    a { color: inherit; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 20px; }

    /* 헤더 */
    header.top { padding: 18px 0; }
    .brand { font-weight: 800; font-size: 18px; text-decoration: none; }

    /* 히어로 */
    .hero { padding: 48px 0 40px; }
    .eyebrow {
      display: inline-block; padding: 6px 14px; border-radius: 999px;
      background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 14px;
    }
    .hero h1 { font-size: clamp(30px, 4.6vw, 46px); line-height: 1.25; margin: 18px 0 12px; letter-spacing: -0.02em; }
    .hero h1 em { font-style: normal; color: var(--primary); }
    .hero p { font-size: 17px; color: var(--sub); margin: 0; }

    /* 앱 목록 */
    .apps { padding: 16px 0 72px; }
    .apps h2 { font-size: 22px; margin: 0 0 18px; letter-spacing: -0.01em; }
    .app {
      display: grid; grid-template-columns: 96px 1fr; gap: 24px; align-items: start;
      background: var(--card); border-radius: var(--radius); padding: 28px;
      box-shadow: 0 1px 0 var(--line), 0 12px 30px rgba(28,32,51,.06);
    }
    .app + .app { margin-top: 20px; }
    .app .icon { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 16px rgba(99,102,241,.2); }
    .app h3 { margin: 0 0 4px; font-size: 22px; }
    .app .tag { margin: 0 0 10px; color: var(--primary); font-weight: 700; font-size: 14px; }
    .app .desc { margin: 0 0 18px; color: var(--sub); font-size: 15.5px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; padding: 10px 16px; border-radius: 12px;
      font-weight: 700; font-size: 15px; text-decoration: none;
      border: 1px solid var(--line); background: var(--card);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(28,32,51,.1); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.sub { color: var(--sub); }

    footer { border-top: 1px solid var(--line); padding: 28px 0 40px; color: var(--sub); font-size: 14px; }
    footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
    footer a { text-decoration: none; }
    footer a:hover { color: var(--primary); }

    @media (max-width: 560px) {
      .app { grid-template-columns: 1fr; padding: 22px; gap: 16px; }
      .app .icon { width: 72px; height: 72px; border-radius: 18px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="./">minuhappy</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <span class="eyebrow">minuhappy apps</span>
        <h1>아이와 함께 쓰기 좋은<br /><em>작고 쉬운 앱</em>을 만듭니다</h1>
        <p>각 앱의 소개 페이지, 스토어 링크, 개인정보처리방침을 확인할 수 있어요.</p>
      </div>
    </section>

    <section class="apps">
      <div class="wrap">
        <h2>앱</h2>

        <article class="app">
          <img class="icon" src="gugudan/assets/icon.png" alt="구구단 마스터 아이콘" width="96" height="96" />
          <div>
            <h3>구구단 마스터</h3>
            <p class="tag">초등 곱셈 학습 앱 · 무료 · 전체 이용가</p>
            <p class="desc">외우기·퀴즈·챌린지 3가지 모드로 2단부터 9단까지 아이 혼자서도 즐겁게 반복해요. 로그인 없이 바로 시작하고, 개인정보를 수집하지 않아요.</p>
            <div class="links">
              <a class="btn primary" href="gugudan/">앱 소개 보기</a>
              <a class="btn" href="https://apps.apple.com/us/app/%EA%B5%AC%EA%B5%AC%EB%8B%A8-%EB%A7%88%EC%8A%A4%ED%84%B0-%EA%B3%B1%EC%85%88-%EA%B5%AC%EA%B5%AC%EB%8B%A8-%ED%95%99%EC%8A%B5/id6814070894" target="_blank" rel="noopener">App Store</a>
              <a class="btn" href="https://play.google.com/store/apps/details?id=com.gugudan.master" target="_blank" rel="noopener">Google Play</a>
              <a class="btn sub" href="gugudan/privacy-policy.html">개인정보처리방침</a>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <a href="mailto:minuhappy@gmail.com">문의: minuhappy@gmail.com</a>
      <div>© <span id="year">2026</span> minuhappy</div>
    </div>
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
